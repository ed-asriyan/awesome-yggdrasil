name: Update or remove a project
description: Report a broken link, a moved project or an unmaintained project.
title: "Update: "
labels: ["maintenance"]
body:
  - type: input
    id: name
    attributes:
      label: Project name
      description: The name of the entry as it appears in the list.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is the problem?
      options:
        - Broken link
        - Project moved or renamed
        - Project is archived or unmaintained
        - Description is wrong
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What should change? Include a link to the new location or proof of the problem if you have one.
    validations:
      required: true
